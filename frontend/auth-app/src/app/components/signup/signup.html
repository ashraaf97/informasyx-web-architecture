<div class="signup-container">
  <div class="signup-card">
    <h2>Create Account</h2>
    
    <form (ngSubmit)="onSignUp()" #signUpForm="ngForm">
      <div class="form-row">
        <div class="form-group">
          <label for="firstName">First Name *</label>
          <input 
            id="firstName"
            name="firstName"
            type="text"
            [(ngModel)]="signUpData.firstName"
            required
            class="form-input"
            placeholder="Enter first name">
        </div>

        <div class="form-group">
          <label for="lastName">Last Name *</label>
          <input 
            id="lastName"
            name="lastName"
            type="text"
            [(ngModel)]="signUpData.lastName"
            required
            class="form-input"
            placeholder="Enter last name">
        </div>
      </div>

      <div class="form-group">
        <label for="username">Username *</label>
        <input 
          id="username"
          name="username"
          type="text"
          [(ngModel)]="signUpData.username"
          required
          class="form-input"
          placeholder="Enter username">
      </div>

      <div class="form-group">
        <label for="email">Email *</label>
        <input 
          id="email"
          name="email"
          type="email"
          [(ngModel)]="signUpData.email"
          required
          class="form-input"
          placeholder="Enter email address">
      </div>

      <div class="form-group">
        <label for="phoneNumber">Phone Number *</label>
        <input 
          id="phoneNumber"
          name="phoneNumber"
          type="tel"
          [(ngModel)]="signUpData.phoneNumber"
          required
          pattern="^60\d{9,10}$"
          class="form-input"
          placeholder="Example: 60123456789">
        <small class="form-hint">Enter your Malaysian phone number starting with 60</small>
      </div>

      <div class="form-group">
        <label for="address">Address</label>
        <textarea 
          id="address"
          name="address"
          [(ngModel)]="signUpData.address"
          class="form-input form-textarea"
          placeholder="Enter address (optional)"
          rows="2">
        </textarea>
      </div>

      <div class="info-message">
        <p><small>Note: You will use your phone number to log in to your account.</small></p>
      </div>

      <div class="error-message" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <div class="success-message" *ngIf="successMessage">
        {{ successMessage }}
      </div>

      <div class="button-group">
        <button 
          type="submit" 
          class="btn btn-primary"
          [disabled]="isLoading || !signUpForm.form.valid">
          <span *ngIf="isLoading">Creating Account...</span>
          <span *ngIf="!isLoading">Create Account</span>
        </button>
        
        <button 
          type="button" 
          class="btn btn-secondary"
          (click)="onCancel()"
          [disabled]="isLoading">
          Cancel
        </button>
      </div>
    </form>

    <div class="login-link">
      <p>Already have an account? <a href="#" (click)="onCancel()">Login here</a></p>
    </div>
  </div>
</div>
